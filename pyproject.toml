[project]
name = "sfumato-fm-radio-tuner"
version = "0.1.0"
description = "FM stereo broadcast chain modeled in Python/NumPy with a CI quality gate (THD / SINAD / stereo separation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "scipy>=1.17.0",
    "soundfile>=0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo"]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
